# Vercel CLI version: vercel@39.3.0 (pinned version released > 2 weeks ago)
# Architecture: Prebuilt deployment model. Builds Next.js once in Actions, then deploys via Vercel CLI.
# All Vercel secrets (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) are injected via env vars and never logged.

name: deploy

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && format('preview-{0}', github.event.workflow_run.pull_requests[0].number) || 'production-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' }}

jobs:
  preview:
    name: preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout pull request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel preview environment settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@39.3.0 pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build prebuilt output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@39.3.0 build --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          PREVIEW_URL=$(npx vercel@39.3.0 deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Post or update preview comment on Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.workflow_run.pull_requests[0]?.number;
            if (!prNumber) {
              console.log('No PR number found in payload.');
              return;
            }

            const previewUrl = '${{ steps.deploy.outputs.url }}';
            const commitSha = context.payload.workflow_run.head_sha.substring(0, 7);
            const marker = '<!-- vercel-preview-url -->';
            const body = `${marker}\n### ⚡ Vercel Preview Deployment\n\n- **Preview URL:** ${previewUrl}\n- **Commit:** \`${commitSha}\`\n\n*Deployed automatically via GitHub Actions.*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingComment = comments.find(c => c.body.includes(marker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
              console.log(`Updated existing comment ${existingComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
              console.log('Created new PR comment');
            }

  production:
    name: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: read

    steps:
      - name: Checkout main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel production environment settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@39.3.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build with production flag
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@39.3.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          PROD_URL=$(npx vercel@39.3.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$PROD_URL" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Vercel Production Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Production URL: $PROD_URL" >> "$GITHUB_STEP_SUMMARY"
